spring.application.name=control-service
server.port=${SERVER_PORT:8080}

# Local Docker Compose defaults. Override in any environment:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/media_platform}
spring.datasource.username=${DB_USERNAME:media_platform}
spring.datasource.password=${DB_PASSWORD:media_platform}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Isolated dispatcher: POST /jobs only writes PostgreSQL.
# Phase 4A: the Go scheduler selects operations and workers. Java commits
# QUEUED -> ASSIGNED + scheduling_decisions + targeted outbox, then this
# publisher loop sends to RabbitMQ. The legacy Java selection loop stays off
# so it does not compete with the Go scheduler.
drive.dispatch.enabled=true
drive.dispatch.scheduling-enabled=false
drive.dispatch.publish-loop-enabled=true
drive.dispatch.publisher-enabled=true
drive.dispatch.http-claim-enabled=false
drive.dispatch.enqueue-interval-ms=500
drive.dispatch.publish-interval-ms=250
drive.dispatch.enqueue-batch-size=20
drive.dispatch.publish-batch-size=20

# Worker liveness. Timeout should be greater than the worker HEARTBEAT_INTERVAL (default 5s).
# UNAVAILABLE means the control plane has not observed a heartbeat within the timeout.
# That is process liveness, not attempt ownership. In-flight work is reclaimed only when
# a RUNNING attempt lease has expired AND its owning worker is UNAVAILABLE.
drive.worker.heartbeat-timeout=${WORKER_HEARTBEAT_TIMEOUT:15s}
drive.worker.heartbeat-sweep-interval=${WORKER_HEARTBEAT_SWEEP_INTERVAL:5s}
drive.worker.heartbeat-sweep-enabled=true

# Execution ownership. Heartbeats are worker-process liveness; leases are attempt ownership.
# Reclaim requires an expired lease AND an UNAVAILABLE worker so a single missed renew
# does not steal work from a healthy worker. LEASE_RENEW_INTERVAL on the worker should
# be less than half of OPERATION_LEASE_DURATION (defaults: 10s renew, 30s lease).
drive.execution.lease-duration=${OPERATION_LEASE_DURATION:30s}
drive.execution.lease-sweep-interval=${OPERATION_LEASE_SWEEP_INTERVAL:5s}
drive.execution.lease-sweep-enabled=true
drive.execution.max-attempts=${MAX_EXECUTION_ATTEMPTS:3}

# Local Compose defaults. Override with RABBITMQ_* in any environment.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:media_platform}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:media_platform}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
