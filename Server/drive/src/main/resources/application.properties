spring.application.name=control-service
server.port=${SERVER_PORT:8080}

# Local Docker Compose defaults. Override in any environment:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/media_platform}
spring.datasource.username=${DB_USERNAME:media_platform}
spring.datasource.password=${DB_PASSWORD:media_platform}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Isolated dispatcher: POST /jobs only writes PostgreSQL.
# Phase 4C: the Go scheduler selects operations (FIFO) and workers
# (LEXICOGRAPHIC, ROUND_ROBIN, or LEAST_LOADED). Java commits QUEUED -> ASSIGNED +
# scheduling_decisions + targeted outbox, then this publisher loop sends
# to RabbitMQ. Least Loaded is not re-checked for optimality at commit.
# The legacy Java selection loop stays off so it does not compete with the Go scheduler.
drive.dispatch.enabled=true
drive.dispatch.scheduling-enabled=false
drive.dispatch.publish-loop-enabled=true
drive.dispatch.publisher-enabled=true
drive.dispatch.http-claim-enabled=false
drive.dispatch.enqueue-interval-ms=500
drive.dispatch.publish-interval-ms=250
drive.dispatch.enqueue-batch-size=20
drive.dispatch.publish-batch-size=20

# Worker liveness. Timeout should be greater than the worker HEARTBEAT_INTERVAL (default 5s).
# UNAVAILABLE means the control plane has not observed a heartbeat within the timeout.
# That is process liveness, not attempt ownership. In-flight work is reclaimed only when
# a RUNNING attempt lease has expired AND its owning worker is UNAVAILABLE.
drive.worker.heartbeat-timeout=${WORKER_HEARTBEAT_TIMEOUT:15s}
drive.worker.heartbeat-sweep-interval=${WORKER_HEARTBEAT_SWEEP_INTERVAL:5s}
drive.worker.heartbeat-sweep-enabled=true

# Execution ownership. Heartbeats are worker-process liveness; leases are attempt ownership.
# Reclaim of RUNNING work requires an expired lease AND an UNAVAILABLE worker so a single
# missed renew does not steal work from a healthy worker. CANCEL_REQUESTED plus an expired
# lease finalizes CANCELLED without requeue, even if the worker never acknowledges.
# LEASE_RENEW_INTERVAL on the worker should be less than half of OPERATION_LEASE_DURATION
# (defaults: 10s renew, 30s lease).
drive.execution.lease-duration=${OPERATION_LEASE_DURATION:30s}
drive.execution.lease-sweep-interval=${OPERATION_LEASE_SWEEP_INTERVAL:5s}
drive.execution.lease-sweep-enabled=true
drive.execution.max-attempts=${MAX_EXECUTION_ATTEMPTS:3}

# Unstarted assignment recovery. Applies only while Operation is ASSIGNED and
# no ExecutionAttempt exists. Distinct from lease duration/sweep, which apply
# after start. Conservative reclaim also requires the selected worker to be
# UNAVAILABLE so a delayed message to a live worker is not stolen.
drive.assignment.start-timeout=${OPERATION_ASSIGNMENT_START_TIMEOUT:15s}
drive.assignment.sweep-interval=${OPERATION_ASSIGNMENT_SWEEP_INTERVAL:5s}
drive.assignment.sweep-enabled=true

# Object store for Artifact download URLs (Java control service). Local MinIO
# defaults only — not production secrets. OBJECT_STORE_ENDPOINT must be reachable
# by the client that will GET the signed URL (use localhost when Java runs on the host).
drive.object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
drive.object-store.region=${OBJECT_STORE_REGION:us-east-1}
drive.object-store.access-key=${OBJECT_STORE_ACCESS_KEY:minioadmin}
drive.object-store.secret-key=${OBJECT_STORE_SECRET_KEY:minioadmin}
drive.object-store.force-path-style=${OBJECT_STORE_FORCE_PATH_STYLE:true}
drive.artifact-access.url-ttl=${ARTIFACT_URL_TTL:15m}

# Optional local/self-hosted bootstrap: attach this raw key to the Flyway
# legacy-system Account so pre-existing Jobs remain reachable. Must be
# mp_live_ + 64 hex characters. Leave unset in tests.
drive.auth.bootstrap-api-key=${MEDIA_PLATFORM_BOOTSTRAP_API_KEY:}
drive.auth.account-registration-enabled=${ACCOUNT_REGISTRATION_ENABLED:false}

# Internal service credentials. Required at startup. Not user API keys.
# Scheduler processes may share SCHEDULER_SERVICE_TOKEN. Workers receive
# per-worker tokens derived from WORKER_TOKEN_PEPPER (see README).
drive.internal.scheduler-token=${SCHEDULER_SERVICE_TOKEN:}
drive.internal.worker-token-pepper=${WORKER_TOKEN_PEPPER:}

# Local Compose defaults. Override with RABBITMQ_* in any environment.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:media_platform}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:media_platform}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
