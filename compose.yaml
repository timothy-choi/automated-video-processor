services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: media_platform
      POSTGRES_USER: media_platform
      POSTGRES_PASSWORD: media_platform
    volumes:
      - media_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_platform -d media_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media_platform_pgdata:
