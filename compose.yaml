x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

x-worker-env: &worker-env
  CONTROL_SERVICE_URL: http://control-service:8080
  RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-media_platform}:${RABBITMQ_PASSWORD:-media_platform}@rabbitmq:5672/
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  OBJECT_STORE_FORCE_PATH_STYLE: "true"
  OUTPUT_BUCKET: media-output
  HEARTBEAT_INTERVAL: 5s
  LEASE_RENEW_INTERVAL: 10s
  PREFETCH: "1"
  <<: *otel-env
  OTEL_SERVICE_NAME: media-worker

x-worker: &worker
  build:
    context: ./worker
    dockerfile: Dockerfile
  init: true
  stop_grace_period: 30s
  restart: unless-stopped
  depends_on:
    control-service:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: media_platform
      POSTGRES_USER: ${POSTGRES_USER:-media_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media_platform}
    volumes:
      - media_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_platform -d media_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-media_platform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-media_platform}
    volumes:
      - media_platform_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_CI_CD: "on"
    volumes:
      - media_platform_minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "MinIO did not become ready"
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/media-input
        mc mb --ignore-existing local/media-output

  control-service:
    build:
      context: ./Server/drive
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/media_platform
      DB_USERNAME: ${POSTGRES_USER:-media_platform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-media_platform}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-media_platform}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-media_platform}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORE_FORCE_PATH_STYLE: "true"
      SCHEDULER_SERVICE_TOKEN: ${SCHEDULER_SERVICE_TOKEN:?run scripts/setup-local-env.sh}
      WORKER_TOKEN_PEPPER: ${WORKER_TOKEN_PEPPER:?run scripts/setup-local-env.sh}
      MEDIA_PLATFORM_BOOTSTRAP_API_KEY: ${MEDIA_PLATFORM_BOOTSTRAP_API_KEY:-}
      ACCOUNT_REGISTRATION_ENABLED: ${ACCOUNT_REGISTRATION_ENABLED:-false}
      ARTIFACT_URL_TTL: ${ARTIFACT_URL_TTL:-15m}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      OTEL_SERVICE_NAME: media-control-service
      <<: *otel-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    environment:
      CONTROL_SERVICE_URL: http://control-service:8080
      SCHEDULER_SERVICE_TOKEN: ${SCHEDULER_SERVICE_TOKEN:?run scripts/setup-local-env.sh}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-500ms}
      OPERATION_POLICY: FIFO
      WORKER_PLACEMENT_POLICY: ${WORKER_PLACEMENT_POLICY:-LEAST_LOADED}
      OTEL_SERVICE_NAME: media-scheduler
      <<: *otel-env
    depends_on:
      control-service:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  worker-a:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-a
      WORKER_HOSTNAME: worker-a
      WORKER_SERVICE_TOKEN: ${WORKER_A_TOKEN:?run scripts/setup-local-env.sh}
      OTEL_RESOURCE_ATTRIBUTES: worker.id=worker-a

  worker-b:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-b
      WORKER_HOSTNAME: worker-b
      WORKER_SERVICE_TOKEN: ${WORKER_B_TOKEN:?run scripts/setup-local-env.sh}
      OTEL_RESOURCE_ATTRIBUTES: worker.id=worker-b

  ingress:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingress
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-service:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/media-platform.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  media_platform_pgdata:
  media_platform_minio:
  media_platform_rabbitmq:
  caddy_data:
  caddy_config:
